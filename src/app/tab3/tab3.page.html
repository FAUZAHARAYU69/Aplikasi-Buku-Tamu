<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Data Buku Tamu</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- PULL TO REFRESH -->
  <ion-refresher slot="fixed" (ionRefresh)="loadData($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- DATA ADA -->
  <ion-list *ngIf="dataBukuTamu.length > 0">

    <ion-card *ngFor="let item of dataBukuTamu" class="tamu-card">

      <ion-card-header>
        <ion-card-title>{{ item.nama }}</ion-card-title>
        <ion-card-subtitle>
          <ion-icon name="calendar-outline"></ion-icon>
          {{ item.tanggal_kunjungan | date:'dd MMM yyyy' }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>

        <ion-item lines="none">
          <ion-icon name="location-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Alamat</h3>
            <p>{{ item.alamat }}</p>
          </ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-icon name="call-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>No HP</h3>
            <p>{{ item.no_hp }}</p>
          </ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-icon name="document-text-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Keperluan</h3>
            <p>{{ item.keperluan }}</p>
          </ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Ditujukan Kepada</h3>
            <p>{{ item.ditujukan_kepada }}</p>
          </ion-label>
        </ion-item>

      </ion-card-content>
    </ion-card>

  </ion-list>

  <!-- DATA KOSONG -->
  <ion-text
    color="medium"
    *ngIf="!loading && dataBukuTamu.length === 0"
    class="ion-text-center empty-text">
    Belum ada data buku tamu
  </ion-text>

</ion-content>
