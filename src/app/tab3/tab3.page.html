<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Data Buku Tamu</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-refresher slot="fixed" (ionRefresh)="loadData($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="dataBukuTamu.length > 0">

    <ion-card *ngFor="let item of dataBukuTamu">
      <ion-card-header>
        <ion-card-title>{{ item.nama }}</ion-card-title>
        <ion-card-subtitle>
          {{ item.tanggal_kunjungan | date:'dd MMM yyyy' }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <p><b>Alamat:</b> {{ item.alamat }}</p>
        <p><b>No HP:</b> {{ item.no_hp }}</p>
        <p><b>Keperluan:</b> {{ item.keperluan }}</p>
        <p><b>Ditujukan Kepada:</b> {{ item.ditujukan_kepada }}</p>
      </ion-card-content>
    </ion-card>

  </ion-list>

  <ion-text
    color="medium"
    *ngIf="!loading && dataBukuTamu.length === 0"
    class="ion-text-center"
    style="margin-top:20px; display:block;">
    Belum ada data buku tamu
  </ion-text>

</ion-content>
